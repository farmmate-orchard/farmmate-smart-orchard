<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmmate Smart Orchard</title><style>body{font-family:system-ui,sans-serif;background:#f3f7f3;color:#183827;margin:0}header{background:#166b45;color:white;padding:20px}main{max-width:680px;margin:auto;padding:15px}section{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 9px #0001}h2{font-size:19px;margin-top:0}label{display:block;margin:9px 0 4px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;border:1px solid #c8d8cd;font-size:16px}button{background:#166b45;color:white;border:0;margin-top:12px;font-weight:bold}.secondary{background:#e8f2eb;color:#166b45}.danger{background:#a22}.item{border-top:1px solid #ddd;padding:12px 0}.small{font-size:13px;color:#52675b}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{width:auto;flex:1;min-width:85px} .hidden{display:none} .inline{display:flex;gap:8px}.inline>*{flex:1;min-width:0}</style></head><body><header><b>🌿 Farmmate Smart Orchard</b><div>智能果园管理 · 手机测试版 v0.1</div></header><main><section><nav><button onclick="show('trees')">树木</button><button onclick="show('work')">作业</button><button onclick="show('history')">历史</button><button onclick="show('backup')">备份</button></nav><p class="small">测试版：数据只存在当前浏览器，清除浏览器数据可能丢失。请定期导出备份。</p></section><section id="trees"><h2>新增树木档案</h2><form id="treeForm"><label>果园名称</label><input name="orchard" required placeholder="平地研究基地"><label>树木编号</label><input name="code" required placeholder="MK-001"><label>品种</label><select name="variety"><option>猫山王</option><option>黑刺</option><option>其他</option></select><label>苗木品牌 / 来源</label><input name="source" placeholder="苗圃或供应商"><label>种植日期</label><input name="planted" type="date"><div class="inline"><div><label>纬度</label><input id="lat" name="lat" readonly placeholder="GPS"></div><div><label>经度</label><input id="lng" name="lng" readonly placeholder="GPS"></div></div><button type="button" class="secondary" onclick="gps()">📍 获取当前位置</button><button>保存树木</button></form><h2>树木列表</h2><div id="treeList"></div></section><section id="work" class="hidden"><h2>新增施肥 / 喷洒记录</h2><form id="workForm"><label>选择树木</label><select id="treeSelect" name="treeId" required></select><label>日期</label><input type="date" name="date" id="workDate" required><label>作业类型</label><select name="type"><option>地面施肥</option><option>叶面肥</option><option>杀虫剂</option><option>杀菌剂</option><option>其他</option></select><label>产品品牌</label><input name="brand" placeholder="Farmmate 或其他品牌"><label>产品名称</label><input name="product" required placeholder="Amino N-Power"><label>用量及单位</label><input name="dose" required placeholder="例如 100 ml / 20 L 水"><label>备注</label><textarea name="notes" rows="3"></textarea><button>保存作业记录</button></form></section><section id="history" class="hidden"><h2>作业历史</h2><div id="workList"></div></section><section id="backup" class="hidden"><h2>数据备份</h2><button onclick="exportData()">导出 JSON 备份</button><label>恢复备份（会覆盖当前数据）</label><input type="file" id="importFile" accept="application/json,.json"><button class="secondary" onclick="importData()">导入备份</button><p class="small">只导入自己信任的备份文件。此版本不支持账户同步或云端备份。</p></section></main><script>
const KEY='farmmate_orchard_v01';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{trees:[],works:[]}}catch(e){data={trees:[],works:[]}};function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function show(id){for(const x of ['trees','work','history','backup'])document.getElementById(x).classList.toggle('hidden',x!==id);render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('treeList').innerHTML=data.trees.length?data.trees.map(t=>`<div class="item"><b>${esc(t.code)}</b> · ${esc(t.variety)}<div class="small">${esc(t.orchard)} · ${esc(t.source||'未填来源')} · ${esc(t.lat||'无GPS')}, ${esc(t.lng||'无GPS')}</div></div>`).join(''):'尚未添加树木';document.getElementById('treeSelect').innerHTML=data.trees.map(t=>`<option value="${esc(t.id)}">${esc(t.orchard)} / ${esc(t.code)}</option>`).join('');document.getElementById('workList').innerHTML=data.works.length?data.works.slice().reverse().map(w=>{let t=data.trees.find(x=>x.id===w.treeId);return `<div class="item"><b>${esc(w.date)} · ${esc(w.type)}</b><div>${esc(t?.code||'未知树木')} · ${esc(w.brand)} ${esc(w.product)}</div><div class="small">${esc(w.dose)} · ${esc(w.notes)}</div></div>`}).join(''):'尚无作业记录'}document.getElementById('treeForm').onsubmit=e=>{e.preventDefault();let t=Object.fromEntries(new FormData(e.target));if(data.trees.some(x=>x.orchard===t.orchard&&x.code===t.code)){alert('该果园已有相同树木编号');return}t.id=crypto.randomUUID();data.trees.push(t);save();e.target.reset();alert('树木已保存')};document.getElementById('workForm').onsubmit=e=>{e.preventDefault();if(!data.trees.length){alert('请先添加树木');return}let w=Object.fromEntries(new FormData(e.target));w.id=crypto.randomUUID();data.works.push(w);save();e.target.reset();document.getElementById('workDate').value=new Date().toLocaleDateString('en-CA');alert('作业已保存')};function gps(){if(!navigator.geolocation){alert('此浏览器不支持 GPS');return}navigator.geolocation.getCurrentPosition(p=>{document.getElementById('lat').value=p.coords.latitude.toFixed(7);document.getElementById('lng').value=p.coords.longitude.toFixed(7);alert('定位成功，精度约 '+Math.round(p.coords.accuracy)+' 米')},e=>alert('无法定位：请检查位置权限，并使用 HTTPS 网站打开。'),{enableHighAccuracy:true,timeout:20000})}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='farmmate-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importData(){let f=document.getElementById('importFile').files[0];if(!f)return alert('请选择备份文件');try{let v=JSON.parse(await f.text());if(!Array.isArray(v.trees)||!Array.isArray(v.works))throw Error('格式不正确');if(!confirm('确认覆盖当前所有树木和作业记录？'))return;data=v;save();alert('导入成功')}catch(e){alert('导入失败：'+e.message)}}document.getElementById('workDate').value=new Date().toLocaleDateString('en-CA');render();
</script></body></html>
